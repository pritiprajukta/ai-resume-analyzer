<!DOCTYPE html>
<html>
<head>
    <title>Resume History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .container {
            margin-top: 50px;
        }

        .card {
            padding: 20px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card shadow">

        <h2 class="text-center text-primary">📊 Resume Prediction History</h2>

        <table class="table table-striped mt-4">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Prediction</th>
                    <th>Score</th>
                    <th>Skills</th>
                </tr>
            </thead>

            <tbody>
                {% for row in data %}
                <tr>
                    <td>{{ row[0] }}</td>
                    <td>{{ row[1] }}</td>
                    <td>{{ row[2] }}</td>
                    <td>{{ row[3] }}%</td>
                    <td>{{ row[4] }}</td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

        <div class="text-center">
            <a href="/" class="btn btn-primary">⬅ Back to Home</a>
        </div>

    </div>

</div>

</body>
</html>
